[project]
name = "job-finder-bot"
version = "0.1.0"
description = "Personal job-discovery pipeline for Toronto/Montreal tech search"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39",
    "httpx[http2]>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "selectolax>=0.3.25",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "ollama>=0.4",
    "feedparser>=6.0",
    "sentry-sdk>=2.18",
    "resend>=2.5",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "xhtml2pdf>=0.2.17",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.385",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]
browser = [
    "playwright>=1.48",
]

[project.scripts]
jfb = "job_finder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_finder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
