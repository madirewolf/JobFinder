services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jfb-postgres
    environment:
      POSTGRES_USER: jfb
      POSTGRES_PASSWORD: jfb_dev
      POSTGRES_DB: jfb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jfb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
